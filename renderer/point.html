<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Multi Clicker Point</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
    }
    body {
      -webkit-app-region: drag;
      cursor: move;
    }
    #point {
      width: 22px;
      height: 22px;
      box-sizing: border-box;
      border: 1px solid rgba(220, 80, 80, 0.9);
      background: rgba(180, 40, 40, 0.65);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="point"></div>
</body>
</html>
