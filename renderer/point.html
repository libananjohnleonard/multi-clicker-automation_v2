<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Multi Clicker Point</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
    }
    body {
      -webkit-app-region: drag;
      cursor: move;
    }
    #point {
      position: relative;
      width: 30px;
      height: 30px;
      box-sizing: border-box;
      border: 1px solid rgba(220, 80, 80, 0.9);
      background: rgba(180, 40, 40, 0.65);
      border-radius: 3px;
    }
    #point::before, #point::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
    }
    #point::before {
      left: 50%;
      top: 4px;
      bottom: 4px;
      width: 1px;
      transform: translateX(-50%);
    }
    #point::after {
      top: 50%;
      left: 4px;
      right: 4px;
      height: 1px;
      transform: translateY(-50%);
    }
  </style>
</head>
<body>
  <div id="point"></div>
</body>
</html>
