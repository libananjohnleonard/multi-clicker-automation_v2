<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Multi Clicker</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background: #1e1e1e;
      color: #eee;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px;
    }
    button {
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 12px;
      cursor: pointer;
    }
    button:hover {
      background: #444;
    }
    #refresh-btn {
      margin-bottom: 12px;
    }
    #window-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #window-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 8px 10px;
    }
    #window-list li.selected {
      border-color: #4a90e2;
    }
    .win-title {
      font-size: 13px;
    }
    .win-process {
      font-size: 11px;
      color: #999;
      margin-left: 6px;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #4a90e2;
    }
    #confirm-panel, #confirmed-panel {
      display: none;
      margin-top: 16px;
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid #4a90e2;
      border-radius: 4px;
    }
    #confirm-panel.visible, #confirmed-panel.visible {
      display: block;
    }
    #confirm-details, #confirmed-details {
      font-size: 13px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Multi Clicker - Select Target App</h1>
  <button id="refresh-btn">Refresh</button>
  <ul id="window-list"></ul>
  <div id="status"></div>

  <div id="confirm-panel">
    <div id="confirm-details"></div>
    <button id="continue-btn">Continue</button>
  </div>

  <div id="confirmed-panel">
    <div id="confirmed-details"></div>
    <button id="change-target-btn">Change Target</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
