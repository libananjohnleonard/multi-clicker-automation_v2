<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Multi Clicker Panel</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      font-family: sans-serif;
      background: #1e1e1e;
      color: #eee;
      border: 1px solid #4a90e2;
      box-sizing: border-box;
      padding: 10px;
      -webkit-app-region: drag;
      user-select: none;
    }
    #target-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .row span {
      font-size: 13px;
    }
    button {
      -webkit-app-region: no-drag;
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #start-btn {
      width: 100%;
      margin-top: 6px;
      padding: 6px;
    }
    #timer-input {
      -webkit-app-region: no-drag;
      width: 48px;
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 13px;
    }
    #timer-status {
      font-size: 11px;
      color: #4a90e2;
      margin-bottom: 8px;
    }
    #countdown-display {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-top: 6px;
      color: #4a90e2;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div id="target-label">No target</div>

  <div class="row">
    <span>Timer (sec)</span>
    <span>
      <input type="number" id="timer-input" min="1" value="6">
      <button id="timer-set-btn">Set</button>
    </span>
  </div>
  <div id="timer-status">Interval: 6s</div>

  <div class="row">
    <span>Grid</span>
    <span>
      <button id="grid-add-btn">+</button>
      <button id="grid-remove-btn" disabled>-</button>
    </span>
  </div>

  <button id="start-btn" disabled>Start</button>
  <div id="countdown-display"></div>

  <script src="panel.js"></script>
</body>
</html>
